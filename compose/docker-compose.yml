name: portfolio
services:
  app:
    container_name: portfolio_frontend
    image: ${PORTFOLIO_IMAGE:?Defina PORTFOLIO_IMAGE}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - /opt/portfolio/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/pt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
